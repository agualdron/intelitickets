spring.application.name=intelitickets
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tickets_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.ai.model.chat=${AI_PROVIDER:openai}
spring.ai.openai.api-key=${AI_API_KEY:sk-local-placeholder}
spring.ai.openai.chat.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.timeout=${AI_TIMEOUT_MS:8000}ms
ai.analysis.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
ai.analysis.retry.backoff-ms=${AI_RETRY_BACKOFF_MS:250}
